      <path d="M76 30 V50 M72.5 32.5 L76 35 L79.5 32.5 M72.5 47.5 L76 45 L79.5 47.5"/>
      <path d="M76 30 V50 M72.5 32.5 L76 35 L79.5 32.5 M72.5 47.5 L76 45 L79.5 47.5" transform="rotate(60 76 40)"/>
      <path d="M76 30 V50 M72.5 32.5 L76 35 L79.5 32.5 M72.5 47.5 L76 45 L79.5 47.5" transform="rotate(120 76 40)"/>
