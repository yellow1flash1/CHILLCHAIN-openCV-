    <mask id="a" maskUnits="userSpaceOnUse"><rect width="120" height="70" fill="#fff"/><rect x="10" y="18" width="52" height="32" rx="16" fill="none" stroke="#000" stroke-width="13"/></mask>
    <mask id="b" maskUnits="userSpaceOnUse"><rect width="120" height="70" fill="#fff"/><path d="M56.8 53.1 A16 16 0 0 1 50.2 42.8" fill="none" stroke="#000" stroke-width="13"/></mask>
    <mask id="c" maskUnits="userSpaceOnUse"><rect width="120" height="70" fill="#fff"/><path d="M19 17 Q 27 11, 35 5" fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round"/></mask>
  </defs>
  <g transform="translate(20 120) scale(4.2)" color="#ffffff">
